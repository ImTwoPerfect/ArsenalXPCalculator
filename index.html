<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Arsenal Level Calculator</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" type="image/x-icon" href="icon.ico">
</head>
<body>
 <div id="wrapper">
  <div class="container">
    <header>
      <h1>Arsenal Level Calculator</h1>
    </header>

    <main>
      <div class="input-group">
        <label>Enter Your Level:
          <input type="number" id="levelInput" />
        </label>
        <label>Compare to Level:
          <input type="number" id="compareInput" />
        </label>
        <label>Avg Kills:
          <input type="number" id="avgKillsInput" step="1" value="19.7"/>
        </label>
        <label>Avg XP:
          <input type="number" id="avgXPInput" step="1" value="523"/>
        </label>
        <label>Avg Round Length (min):
          <input type="number" id="avgRoundInput" step="0.1" value="2.5"/>
        </label>

		<label class="checkbox-label">
		  <input type="checkbox" id="xpBoost" />
		  <span>XP Boost</span>
		</label>

		<label class="checkbox-label">
		  <input type="checkbox" id="estimatesOnly" />
		  <span>Estimates Only</span>
		</label>


        <button id="calcButton">📟 Calculate</button>
        <button id="toggleSidePanel">📊 Import Averages</button>
      </div>

      <pre id="output"></pre>
    </main>
  </div>

  <!-- Side panel -->
  <div id="sidePanel" class="side-panel">
    <div class="side-content">
      <h2>📊 Import Averages</h2>
	  <p>To import average stats, head to your career stats page and input the data to the proper box. Level XP is found on the main screen.</p><br>
      <label>Career Kills:
        <input type="number" id="careerKillsInput" />
      </label>
      <label>Rounds Played:
        <input type="number" id="roundsPlayedInput" />
      </label>
      <label>Total Level XP:
        <input type="number" id="levelXPInput" />
      </label>
      <button id="fillAveragesButton">Calculate &amp; Fill</button>
      <button id="closeSidePanel">Close</button>
    </div>
  </div>
 </div>

  <script src="script.js"></script>
</body>
</html>
